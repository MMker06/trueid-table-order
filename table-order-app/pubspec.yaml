name: trueid_table_order
description: TrueID 테이블 오더 — 신분증 위변조 판별 및 생체인증 성인 인증 단말기 앱
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # 네트워크
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # 카메라 & 이미지
  camera: ^0.10.5+9
  image_picker: ^1.1.2
  image: ^4.1.7

  # 생체인증 (얼굴/지문)
  local_auth: ^2.2.0

  # 보안 저장소 (JWT 등)
  flutter_secure_storage: ^9.0.0

  # UI
  gap: ^3.0.1
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3

  # 라우팅
  go_router: ^13.2.1

  # QR 스캔 / 생성
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  http_parser: ^4.0.2

  # 유틸
  intl: ^0.19.0
  uuid: ^4.4.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
